name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # A SKILL.md the installer cannot parse is skipped silently, so a broken
      # release looks like an empty repo rather than an error. This is the guard.
      - run: node tools/validate.mjs
      - run: npx --yes skills-ref@0.1 validate ./skills/your-next-resume
        continue-on-error: true

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # render-pdf.mjs is Node; ubuntu-latest happens to ship it, but don't rely on that.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: tools/render-check.sh
